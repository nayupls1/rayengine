schema_version = 1

[render]
render_scale = 1.0
anti_aliasing = "none"

[fonts.comparison]
path = "assets/iAWriterMonoS-Regular.ttf"
raster_size = 64
filter = "bilinear"
rasterization = "adaptive"

[profiles.native.render]
render_scale = 1.0
anti_aliasing = "none"

[profiles.fxaa.render]
anti_aliasing = "fxaa"

[profiles."2x".render]
render_scale = 2.0

[profiles."2x-fxaa".render]
render_scale = 2.0
anti_aliasing = "fxaa"

[profiles.pixel.render]
scale_mode = "integer_fit"
render_scale = 1.0
anti_aliasing = "none"
