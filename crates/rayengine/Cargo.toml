[package]
name = "rayengine"
description = "A small Linux-first Rust game SDK over raylib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enable the bundled GLFW Wayland backend. raylib's separate `wayland` alias
# adds an unnecessary system GLFW link and does not enable this CMake option.
wayland = ["raylib/GLFW_BUILD_WAYLAND"]

[dependencies]
rayengine-core.workspace = true
raylib = { workspace = true, features = ["SUPPORT_IMAGE_GENERATION"] }

# Deny unsafe everywhere except the private, documented material ownership bridge.
# Other workspace crates continue to inherit unsafe_code = "forbid".
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
