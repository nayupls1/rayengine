[package]
name = "rayengine-particles"
publish = false
description = "Bounded CPU particle effects and optional 2D/3D rendering for rayengine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["game", "particles", "effects"]
categories = ["game-development"]

[dependencies]
rayengine-core.workspace = true
rayengine = { workspace = true, optional = true }

[features]
default = []
render = ["dep:rayengine"]

[dev-dependencies]
criterion.workspace = true

[[example]]
name = "effects"
required-features = ["render"]

[[bench]]
name = "particles"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["render"]
targets = ["x86_64-unknown-linux-gnu"]
