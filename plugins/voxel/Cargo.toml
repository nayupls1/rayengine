[package]
name = "rayengine-voxel"
description = "Voxel storage, queries, CPU meshing and optional raylib rendering for rayengine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rayengine-core.workspace = true
rayengine = { workspace = true, optional = true }

[features]
default = []
render = ["dep:rayengine"]

[[example]]
name = "render"
required-features = ["render"]

[[bench]]
name = "voxel_render"
harness = false
required-features = ["render"]

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "voxel"
harness = false

[lints]
workspace = true

[[example]]
name = "stream_render"
required-features = ["render"]
