[package]
name = "rayengine-voxel"
description = "Voxel storage, queries, CPU meshing and optional raylib rendering for rayengine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rayengine-voxel"
keywords = ["game", "voxel", "meshing"]
categories = ["game-development"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "docs/**", "examples/**", "benches/**", "tests/**"]

[dependencies]
rayengine-core.workspace = true
rayengine = { workspace = true, optional = true }

[features]
default = []
render = ["dep:rayengine"]

[[example]]
name = "render"
required-features = ["render"]

[[bench]]
name = "voxel_render"
harness = false
required-features = ["render"]

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "voxel"
harness = false

[lints]
workspace = true

[[example]]
name = "stream_render"
required-features = ["render"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
