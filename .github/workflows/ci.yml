name: checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - name: CPU-only primitives require no raylib toolchain
        run: cargo test --locked -p rayengine-core -p rayengine-voxel -p rayengine-minecraft -p rayengine-particles
      - name: Headless voxel examples
        run: |
          cargo run --locked -p rayengine-voxel --example query
          cargo run --locked -p rayengine-voxel --example stream
          cargo run --locked -p rayengine-minecraft --bin terrain -- --seed 42 --chunk=-1,2,0
          cargo run --locked -p rayengine-minecraft --bin textures

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
      - name: SDK, gameplay, CLI and docs
        run: scripts/check.sh
      - name: Generated projects compile
        run: python3 scripts/template_smoke.py
      - name: Native Wayland demo build
        run: cargo check --locked -p rayengine-minecraft --features render,rayengine/wayland
      - name: Native renderer, resize and asset probes
        run: xvfb-run -a scripts/native_smoke.sh
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Benchmark harnesses compile
        run: cargo bench --locked --workspace --features rayengine-voxel/render,rayengine-minecraft/render,rayengine-particles/render --no-run
      - name: Build Linux Minecraft candidate and offline reference
        run: python3 scripts/package_minecraft.py
      - name: Validate the extracted candidate outside the checkout
        run: xvfb-run -a python3 scripts/test_minecraft_package.py artifacts/releases
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Upload Minecraft candidate and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-linux-${{ github.sha }}
          path: |
            artifacts/releases/*.tar.gz
            artifacts/releases/*.sha256
            artifacts/smoke/
          if-no-files-found: warn

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
        with:
          toolchain: '1.89.0'
      - name: Minimum Rust version
        run: cargo check --locked --workspace --all-targets --features rayengine-voxel/render,rayengine-minecraft/render,rayengine-particles/render

  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
      - name: Release validation guards
        run: python3 scripts/test_release_check.py
      - name: Verify all four crates before any first publication
        run: python3 scripts/release_check.py --package
      - name: Install minimum Rust for fresh consumer checks
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Test installed CLI and fresh consumers on minimum Rust
        run: python3 scripts/release_smoke.py --toolchain 1.89.0
      - name: SDK documentation without native raylib linking
        run: cargo doc --locked -p rayengine --no-deps --features raylib/nobuild
        env:
          RUSTDOCFLAGS: '-D warnings'
      - name: Default CPU documentation
        run: cargo doc --locked -p rayengine-core -p rayengine-voxel --no-deps
        env:
          RUSTDOCFLAGS: '-D warnings'
      - name: Upload crate candidates and checksums
        uses: actions/upload-artifact@v4
        with:
          name: crate-candidates
          path: |
            target/package/*.crate
            target/package/SHA256SUMS
          if-no-files-found: error
