[workspace]
members = ["crates/rayengine-core", "crates/rayengine", "crates/rayengine-cli", "examples/games", "examples/minecraft", "plugins/beacons", "plugins/voxel", "plugins/particles", "plugins/tilemap"]
resolver = "3"

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nayupls1/rayengine"

[workspace.dependencies]
rayengine-core = { path = "crates/rayengine-core", version = "0.0.2" }
rayengine = { path = "crates/rayengine", version = "0.0.2" }
raylib = "=6.0.0"
hecs = "0.11.1"
glam = "0.30"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
crc32fast = "1.5"
toml = "0.9"
globset = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
